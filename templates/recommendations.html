<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="/static/CSS/style.css">
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 0;
        }

        .navbar nav ul {
            list-style-type: none;
            padding: 15px;
            margin: 0;
            display: flex;
            gap: 20px;
            background-color: #f4f4f4;
            align-items: center;
        }

        .navbar a {
            text-decoration: none;
            color: #333;
        }

        .brand-container {
            font-weight: bold;
            margin-right: auto;
        }

        .container {
            text-align: center;
            max-width: 800px;
            margin: 30px auto;
            padding: 0 15px;
        }

        .search-container {
            margin: 20px 0;
        }

        .search-input {
            padding: 10px;
            width: 60%;
            max-width: 300px;
        }

        .search-btn {
            padding: 10px 15px;
            cursor: pointer;
        }

        .back-btn {
            background-color: #077A7D;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            display: inline-block;
            border-radius: 6px;
            font-weight: bold;
            margin-top: 10px;
        }

        .back-btn.clear {
            background-color: rgb(253, 81, 81);
            color: black;
        }

        .books-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            width: 200px;
            text-align: center;
        }

        .card img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
        }

        .error-msg {
            color: rgb(253, 81, 81);
        }
    </style>
</head>

<body>
    <div class="navbar">
        <nav>
            <ul>
                <li class="brand-container">My Book Recommendor</li>
                <li><a href="/">🏠 Home</a></li>
                <li><a href="/recommendations">📕 Recommendations</a></li>
                <li><a href="/about">ℹ️ About</a></li>
            </ul>
        </nav>
    </div>

    <div class="container">
        <h1>Recommendations Section</h1>

        <form action="/recommend" method="get" class="search-container" autocomplete="off">
            <input type="text" id="book-search" name="book_name" class="search-input" placeholder="Enter a book name"
                required list="book-suggestions">
            <datalist id="book-suggestions"></datalist>
            <button type="submit" class="search-btn">Get Recommendations</button>
        </form>

        {% if error %}
        <div>
            <h3 class="error-msg">⚠️ {{ error }}</h3>
            <a href="/recommendations" class="back-btn">Clear Search</a>
        </div>
        {% endif %}

        {% if data %}
        <div>
            <a href="/recommendations" class="back-btn clear">🔄 Clear & Refresh</a>
        </div>

        <div class="books-container">
            {% for book in data %}
            <div class="card">
                <img src="{{ book[2] }}" onerror="this.onerror=null; this.src='/static/default_book.png';"
                    alt="Book Cover">
                <h3>{{ book[0] }}</h3>
                <p>{{ book[1] }}</p>
            </div>
            {% endfor %}
        </div>
        {% endif %}
    </div>

    <script>
        const searchInput = document.getElementById('book-search');
        const dataList = document.getElementById('book-suggestions');

        searchInput.addEventListener('input', async function () {
            const query = this.value;

            if (query.length < 2) {
                dataList.innerHTML = '';
                return;
            }

            try {
                const response = await fetch(`/suggest-books?q=${encodeURIComponent(query)}`);
                const suggestions = await response.json();

                dataList.innerHTML = '';
                suggestions.forEach(book => {
                    const option = document.createElement('option');
                    option.value = book;
                    dataList.appendChild(option);
                });
            } catch (error) {
                console.error("Suggestions fetch karne mein dikkat aayi:", error);
            }
        });
    </script>
</body>

</html>
